# Builds the macOS app and Windows exe and publishes them as a GitHub release.
# Versions come from git tags; nothing in the repo is edited per release.
#   - push to main (app changes)  → next patch version, e.g. v0.1.0 → v0.1.1
#   - Run workflow (Actions tab)  → choose patch / minor / major
#   - push a tag like v1.0.0      → releases exactly that version
# Add [skip ci] to a commit message to push without releasing.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [README.md, "docs/**", "tests/**", "tools/**", .gitignore]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release              # one release at a time, so versions never collide
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # all tags
      - id: next
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          elif git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already released as $(git tag --points-at HEAD | grep '^v')"; exit 0
          else
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *)     version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon
            asset: s6deck-macos-arm64.zip
          - os: windows-latest
            asset: s6deck-windows-x64.zip
    runs-on: ${{ matrix.os }}
    env:
      S6DECK_VERSION: ${{ needs.version.outputs.version }}   # read by packaging/s6deck.spec
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        run: python -m pytest
      - name: Build
        run: pyinstaller --noconfirm packaging/s6deck.spec

      - name: Self-test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/s6deck.app/Contents/MacOS/s6deck --self-test
          ditto -c -k --keepParent dist/s6deck.app "${{ matrix.asset }}"
      - name: Self-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windowed exe: no console output, so check the exit code.
          $test = Start-Process dist\s6deck\s6deck.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "self-test failed ($($test.ExitCode))" }
          Compress-Archive -Path dist\s6deck -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        # Creates the tag on the built commit if it doesn't exist yet.
        run: gh release create "$TAG" *.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
