# Builds the macOS app and Windows exe. Pushing a tag like v0.2.0 publishes them as a
# GitHub release; running the workflow by hand only uploads them as workflow artifacts.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon
            asset: s6deck-macos-arm64.zip
          - os: windows-latest
            asset: s6deck-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        run: python -m pytest
      - name: Build
        run: pyinstaller --noconfirm packaging/s6deck.spec

      - name: Self-test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/s6deck.app/Contents/MacOS/s6deck --self-test
          ditto -c -k --keepParent dist/s6deck.app "${{ matrix.asset }}"
      - name: Self-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windowed exe: no console output, so check the exit code.
          $test = Start-Process dist\s6deck\s6deck.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "self-test failed ($($test.ExitCode))" }
          Compress-Archive -Path dist\s6deck -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
